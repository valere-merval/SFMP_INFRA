name: sfmp

services:
  postgres:
    image: postgres:16-alpine
    container_name: sfmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sfmp}
      POSTGRES_USER: ${POSTGRES_USER:-sfmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sfmp}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sfmp} -d ${POSTGRES_DB:-sfmp}']
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: sfmp-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-sfmp}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-sfmp}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-sfmp}
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --username ${MONGO_ROOT_USER:-sfmp} --password ${MONGO_ROOT_PASSWORD:-sfmp} --authenticationDatabase admin --eval "db.runCommand({ ping: 1 })" > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sfmp-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: bitnamilegacy/zookeeper:3.9.3-debian-12-r22
    container_name: sfmp-zookeeper
    restart: unless-stopped
    environment:
      ALLOW_ANONYMOUS_LOGIN: 'yes'
    ports:
      - '2181:2181'

  kafka:
    image: bitnamilegacy/kafka:3.9.0-debian-12-r13
    container_name: sfmp-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: '1'
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
    ports:
      - '${KAFKA_PORT:-29092}:29092'
    healthcheck:
      test: ['CMD-SHELL', '/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 15s
      timeout: 10s
      retries: 20

  minio:
    image: bitnamilegacy/minio:latest
    container_name: sfmp-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sfmp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sfmp12345}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: pgsty/mc:latest
    container_name: sfmp-minio-init
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -lc
      - |
        set -eu
        i=0
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-sfmp} ${MINIO_ROOT_PASSWORD:-sfmp12345}; do
          i=$((i+1))
          if [ "$i" -ge 60 ]; then
            echo 'minio did not become ready in time'
            exit 1
          fi
          echo 'waiting for minio...'
          sleep 2
        done
        mc mb --ignore-existing local/sfmp-events
        mc mb --ignore-existing local/sfmp-media
        mc mb --ignore-existing local/sfmp-docs
        mc anonymous set download local/sfmp-media || true
    restart: 'no'

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sfmp-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - '${KAFKA_UI_PORT:-8082}:8080'

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sfmp-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@sfmp.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'

  mongo-express:
    image: mongo-express:latest
    container_name: sfmp-mongo-express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-sfmp}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-sfmp}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-sfmp}:${MONGO_ROOT_PASSWORD:-sfmp}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: 'false'
    ports:
      - '${MONGO_EXPRESS_PORT:-8081}:8081'

  backend:
    image: eclipse-temurin:21-jdk
    container_name: sfmp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    working_dir: /workspace/SFMP_BE
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sfmp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sfmp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sfmp}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SFMP_AUTH_SECRET: ${SFMP_AUTH_SECRET:-sfmp-local-compose-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.3-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USER:-sfmp}:${MONGO_ROOT_PASSWORD:-sfmp}@mongo:27017/${MONGO_DB:-sfmp}?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-sfmp}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sfmp12345}
    volumes:
      - ../SFMP_BE:/workspace/SFMP_BE
      - gradle_cache:/home/gradle/.gradle
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    command: ['bash', '-lc', './gradlew bootRun --no-daemon']

  web:
    image: node:22-alpine
    container_name: sfmp-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    working_dir: /workspace/SFMP_WEB
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}
    volumes:
      - ../SFMP_WEB:/workspace/SFMP_WEB
      - web_node_modules:/workspace/SFMP_WEB/node_modules
    ports:
      - '${WEB_PORT:-5173}:5173'
    command: ['sh', '-lc', 'npm ci && npm run dev -- --host 0.0.0.0 --port 5173']

volumes:
  postgres_data:
  mongo_data:
  minio_data:
  gradle_cache:
  web_node_modules:
